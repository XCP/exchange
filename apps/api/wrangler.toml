name = "xcpdex-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Aggregator-facing custom domain; workers.dev stays on for existing consumers.
workers_dev = true
routes = [
  { pattern = "api.xcpdex.com", custom_domain = true },
]

# Workers Logs. Without this there are no per-route logs at all, which is why
# this worker's ~708 unhandled exceptions a day could be counted from
# analytics but never read. Both sibling repos have had it since they were
# written. Turn head_sampling_rate down if volume becomes a problem; do not
# turn observability off.
#
# 2026-08-18: back down to 0.05. The exceptions this was raised for have been
# at zero since 01:00 UTC, after months at a flat 24-38/hr. The analytics
# count of scriptThrewException is NOT head-sampled, so a recurrence stays
# fully visible either way; only the log bodies are now 1-in-20.
[observability]
enabled = true
head_sampling_rate = 0.05

[limits]
cpu_ms = 300000

[triggers]
crons = ["*/2 * * * *"]

# Site-wide headcount. One fixed instance: the whole point is that every visitor
# lands in the SAME room, and a second one would just split the number in half.
# Costs nothing at rest — no alarm, no polling, hibernated sockets.
[[durable_objects.bindings]]
name = "SITE_PRESENCE"
class_name = "SitePresence"

# SQLite-backed classes are the only kind new namespaces can be, and this one
# stores nothing anyway — visitor ids ride on the socket via
# serializeAttachment so they survive hibernation.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SitePresence"]

[[d1_databases]]
binding = "DB"
database_name = "xcpdex"
database_id = "c30d6223-aee2-4ee5-a9a2-e6ff2ce3dede"
migrations_dir = "migrations"

[vars]
CP_API_BASE = "https://api.counterparty.io:4000/v2"
