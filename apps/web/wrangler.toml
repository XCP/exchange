name = "xcpdex"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers Logs. Neither exchange worker had this, so the p99 (329ms CPU, the
# highest per-request of any worker on the account) could be measured but not
# explained, and the API's ~708 unhandled exceptions a day could be counted
# but not read. Both sibling repos have had it since they were written.
#
# 2026-08-18: back down to 0.05. The exceptions this was raised for have been
# at zero since 01:00 UTC, after months at a flat 24-38/hr. The analytics
# count of scriptThrewException is NOT head-sampled, so a recurrence stays
# fully visible either way; only the log bodies are now 1-in-20.
[observability]
enabled = true
head_sampling_rate = 0.05

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Server-rendered reads use direct Worker calls. Browser requests continue
# to use the public API domains.
[[services]]
binding = "DEX_API"
service = "xcpdex-api"

[[services]]
binding = "XCP_API"
service = "xcp-api"

# Next's data/route cache. The binding NAME is fixed by the adapter's
# r2-incremental-cache override in open-next.config.ts — renaming it turns
# caching back off silently, with no error.
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "xcpdex-inc-cache"
# LIFECYCLE: objects expire after 30 days, set 2026-08-17 via
#   wrangler r2 bucket lifecycle add <bucket> expire-stale-isr "" --expire-days 30
# Recorded here because it is NOT in code and nothing else would reveal it.
# OpenNext only ever WRITES to this bucket -- there is no eviction, so one
# object accumulates per unique URL rendered, forever. xcpdex-inc-cache reached
# 56,310 objects in its first day against a key space of 12,444 pairs and
# 248,029 assets. Expiry is safe: a missing entry is a cache miss, so the next
# request re-renders and re-caches it.

