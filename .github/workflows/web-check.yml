name: Web amount safety
on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-check.yml"
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check --workspace apps/web
      - run: npm run lint:amounts --workspace apps/web
      - run: npm test --workspace apps/api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e --workspace apps/web
